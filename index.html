<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados del día</title>
<style>
  :root { --img: url("res.jpeg"); }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a2a6b;
    overflow: hidden;
    cursor: pointer;
  }

  /* Dos capas con los colores de la propia imagen:
     arriba = azul profundo, abajo = mar turquesa y monedas doradas */
  .bg {
    position: fixed;
    inset: -10%;
    background-image: var(--img);
    background-size: 220% auto;
    background-repeat: no-repeat;
    filter: blur(22px) saturate(1.35) brightness(.9);
  }
  #bgTop {
    background-position: 0% 0%;
    animation: panTop 24s ease-in-out infinite alternate,
               fadeTop 20s ease-in-out infinite;
  }
  #bgBottom {
    background-position: 100% 100%;
    animation: panBottom 24s ease-in-out infinite alternate,
               fadeBottom 20s ease-in-out infinite;
  }
  @keyframes panTop    { from { background-position: 0% 0%;     transform: scale(1); }
                         to   { background-position: 100% 0%;   transform: scale(1.12); } }
  @keyframes panBottom { from { background-position: 100% 100%; transform: scale(1.12); }
                         to   { background-position: 0% 100%;   transform: scale(1); } }
  @keyframes fadeTop    { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes fadeBottom { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

  /* Destellos en los colores de la imagen: blanco, dorado, celeste */
  #sparkles { position: fixed; inset: 0; pointer-events: none; }
  .sp {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle ease-in-out infinite;
  }
  .white { background:#fff;    box-shadow: 0 0 12px 4px rgba(255,255,255,.9), 0 0 28px 10px rgba(180,220,255,.5); }
  .gold  { background:#ffe27a; box-shadow: 0 0 12px 4px rgba(255,214,90,.9),  0 0 30px 10px rgba(255,170,40,.5); }
  .cyan  { background:#aff4ff; box-shadow: 0 0 12px 4px rgba(120,235,255,.9), 0 0 30px 10px rgba(40,190,230,.5); }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.2) translateY(0); }
    50%      { opacity: 1; transform: scale(1)  translateY(-50px); }
  }

  /* Imagen principal (vertical 1080 x 1920) */
  #res {
    position: relative;
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(0, 20, 60, .7));
  }
</style>
</head>
<body>
  <div class="bg" id="bgTop"></div>
  <div class="bg" id="bgBottom"></div>
  <div id="sparkles"></div>
  <img id="res" src="res.jpeg" alt="Resultados del día" width="1080" height="1920">

  <script>
    // Destellos aleatorios
    var box = document.getElementById('sparkles');
    var colors = ['white', 'gold', 'cyan', 'gold', 'white'];
    for (var i = 0; i < 70; i++) {
      var s = document.createElement('div');
      var size = 2 + Math.random() * 5;
      s.className = 'sp ' + colors[Math.floor(Math.random() * colors.length)];
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDuration = 2 + Math.random() * 4 + 's';
      s.style.animationDelay = Math.random() * 5 + 's';
      box.appendChild(s);
    }

    // Clic = pantalla completa (otro clic = salir)
    document.body.addEventListener('click', function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Recarga la imagen (y los fondos) cada 60 segundos
    setInterval(function () {
      var url = 'res.jpeg?t=' + Date.now();
      document.getElementById('res').src = url;
      document.documentElement.style.setProperty('--img', 'url("' + url + '")');
    }, 60000);
  </script>
</body>
</html>
