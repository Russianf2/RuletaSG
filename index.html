<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Display</title>
<style>
  :root {
    --speed: 1100ms;                        /* transition duration */
    --ease: cubic-bezier(.65, 0, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    overflow: hidden;
    background: #000;
    cursor: none;
  }

  .stage { position: fixed; inset: 0; overflow: hidden; }

  /* Each post is a full-screen 1920x1080 (16:9) image */
  .slide {
    position: absolute; inset: 0;
    transform: translateX(100%);            /* parked off-screen right */
    visibility: hidden;
    overflow: hidden;
    will-change: transform, opacity;
  }
  .slide.active    { transform: translateX(0); visibility: visible; }
  .slide.animating { transition: transform var(--speed) var(--ease), opacity var(--speed) ease; visibility: visible; }
  .slide.leaving   { opacity: .6; }

  .slide img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;                      /* fills the whole screen */
    display: block;
    user-select: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .slide.animating { transition-duration: 1ms; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<script>
(() => {
  "use strict";

  const INTERVAL = 5000;   // ms between transitions
  const SPEED    = 1100;   // ms, must match --speed in CSS

  /* The three 1920x1080 posts, loaded from the same folder as this index.html */
  const NAMES = ["Imagen1", "Imagen2", "Imagen3"];
  const EXTS  = ["png", "jpg", "jpeg", "webp"];   // tried in this order for each name

  const stage = document.getElementById("stage");

  /* Tries Imagen1.png, Imagen1.jpg, ... until one loads, so the extension doesn't matter */
  function loadWithAnyExtension(img, name) {
    let i = 0;
    img.onerror = () => { if (++i < EXTS.length) img.src = `${name}.${EXTS[i]}`; };
    img.src = `${name}.${EXTS[0]}`;
  }

  const slides = NAMES.map((name) => {
    const el = document.createElement("div");
    el.className = "slide";
    const img = new Image();
    loadWithAnyExtension(img, name);
    img.alt = "";
    img.draggable = false;
    el.appendChild(img);
    stage.appendChild(el);
    return el;
  });

  /* ---------- Transition: next image enters from the right, current exits left ---------- */
  let current = 0;

  function advance() {
    const next = (current + 1) % slides.length;
    const out = slides[current], inc = slides[next];

    inc.classList.remove("active", "animating", "leaving");
    inc.style.transform = "";
    void inc.offsetWidth;

    out.classList.remove("active");
    out.classList.add("animating", "leaving");
    inc.classList.add("animating", "active");
    out.style.transform = "translateX(-100%)";

    setTimeout(() => {
      out.classList.remove("animating", "leaving");
      out.style.transform = "";
    }, SPEED + 60);

    current = next;
  }

  /* ---------- Always-on loop: timestamp-based, never pauses ---------- */
  let nextAt = performance.now() + INTERVAL;

  function tick() {
    const now = performance.now();
    if (now >= nextAt) {
      advance();
      nextAt += INTERVAL;
      if (nextAt < now) nextAt = now + INTERVAL;   // catch up after a throttled tab
    }
    setTimeout(tick, Math.max(20, Math.min(250, nextAt - performance.now())));
  }

  slides[0].classList.add("active");
  tick();
})();
</script>
</body>
</html>
